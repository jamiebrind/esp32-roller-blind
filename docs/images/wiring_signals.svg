<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1188" viewBox="0 0 1680 1188"><rect width="100%" height="100%" fill="white"/><rect x="24" y="24" width="1632" height="1140" fill="white" stroke="#263238" stroke-width="1.5"/><text x="50" y="68" font-family="Arial, sans-serif" font-size="29" font-weight="bold" fill="#182b40" text-anchor="start">DETAILED WIRING - MOTOR DRIVE / ENCODER FEEDBACK</text><text x="50" y="99" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#182b40" text-anchor="start">RB-EL-001 / REV B / 14 OCT 2026 / Firmware 2.0.2 / millimetres not applicable - schematic</text><polyline points="40,116 1640,116" fill="none" stroke="#263238" stroke-width="1" stroke-linejoin="round"/><rect x="40" y="1100" width="1600" height="64" fill="#f3f6f9" stroke="#263238" stroke-width="1"/><text x="55" y="1126" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#182b40" text-anchor="start">ESP32-C3 + DRV8871 + JGY-370 encoder motor | Terminal labels take precedence over board position.</text><text x="55" y="1150" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#182b40" text-anchor="start">RUN: 12V supply only. SERVICE USB: 12V OFF. Never feed ESP 3V3 from Mini360 while USB is connected.</text><text x="1618" y="1127" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#182b40" text-anchor="end">2 / 3</text><rect x="90" y="240" width="450" height="550" fill="white" stroke="#526274" stroke-width="2"/><rect x="90" y="240" width="450" height="76" fill="#eef3f8" stroke="#526274" stroke-width="1"/><text x="106" y="269" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#182b40" text-anchor="start">U2  ESP32-C3 SuperMini</text><text x="106" y="296" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#182b40" text-anchor="start">Firmware pins; not physical header order</text><rect x="930" y="200" width="450" height="300" fill="white" stroke="#526274" stroke-width="2"/><rect x="930" y="200" width="450" height="76" fill="#eef3f8" stroke="#526274" stroke-width="1"/><text x="946" y="229" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#182b40" text-anchor="start">U3  DRV8871</text><text x="946" y="256" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#182b40" text-anchor="start">IN1 / IN2 controls; OUT1 / OUT2 motor</text><rect x="930" y="500" width="340" height="290" fill="white" stroke="#526274" stroke-width="2"/><rect x="930" y="500" width="340" height="76" fill="#eef3f8" stroke="#526274" stroke-width="1"/><text x="946" y="529" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#182b40" text-anchor="start">E1  Integral encoder</text><text x="946" y="556" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#182b40" text-anchor="start">Inside six-wire JGY-370 motor</text><rect x="1270" y="790" width="320" height="210" fill="white" stroke="#526274" stroke-width="2"/><rect x="1270" y="790" width="320" height="76" fill="#eef3f8" stroke="#526274" stroke-width="1"/><text x="1286" y="819" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#182b40" text-anchor="start">M1  12V DC motor</text><text x="1286" y="846" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#182b40" text-anchor="start">RED / WHITE motor leads</text><polyline points="540,340 930,340" fill="none" stroke="#ffffff" stroke-width="11.5" stroke-linejoin="round"/><polyline points="540,340 930,340" fill="none" stroke="#7b1fa2" stroke-width="3.5" stroke-linejoin="round"/><polyline points="540,430 930,430" fill="none" stroke="#ffffff" stroke-width="11.5" stroke-linejoin="round"/><polyline points="540,430 930,430" fill="none" stroke="#d65f00" stroke-width="3.5" stroke-linejoin="round"/><polyline points="540,600 930,600" fill="none" stroke="#ffffff" stroke-width="11.5" stroke-linejoin="round"/><polyline points="540,600 930,600" fill="none" stroke="#a68400" stroke-width="3.5" stroke-linejoin="round"/><polyline points="540,690 930,690" fill="none" stroke="#ffffff" stroke-width="11.5" stroke-linejoin="round"/><polyline points="540,690 930,690" fill="none" stroke="#218739" stroke-width="3.5" stroke-linejoin="round"/><polyline points="1380,300 1570,300 1570,720 1360,720 1360,790" fill="none" stroke="#ffffff" stroke-width="11.5" stroke-linejoin="round"/><polyline points="1380,300 1570,300 1570,720 1360,720 1360,790" fill="none" stroke="#c62828" stroke-width="3.5" stroke-linejoin="round"/><polyline points="1380,400 1510,400 1510,750 1480,750 1480,790" fill="none" stroke="#607080" stroke-width="8" stroke-linejoin="round"/><polyline points="1380,400 1510,400 1510,750 1480,750 1480,790" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round"/><circle cx="540" cy="340" r="6" stroke="#263238" fill="white" stroke-width="2"/><text x="525" y="330" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#182b40" text-anchor="end">GPIO0</text><circle cx="540" cy="430" r="6" stroke="#263238" fill="white" stroke-width="2"/><text x="525" y="420" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#182b40" text-anchor="end">GPIO1</text><circle cx="540" cy="600" r="6" stroke="#263238" fill="white" stroke-width="2"/><text x="525" y="590" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#182b40" text-anchor="end">GPIO3 (ENC_A)</text><circle cx="540" cy="690" r="6" stroke="#263238" fill="white" stroke-width="2"/><text x="525" y="680" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#182b40" text-anchor="end">GPIO4 (ENC_B)</text><circle cx="930" cy="340" r="6" stroke="#263238" fill="white" stroke-width="2"/><text x="945" y="330" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#182b40" text-anchor="start">IN1</text><circle cx="930" cy="430" r="6" stroke="#263238" fill="white" stroke-width="2"/><text x="945" y="420" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#182b40" text-anchor="start">IN2</text><circle cx="1380" cy="300" r="6" stroke="#263238" fill="white" stroke-width="2"/><text x="1365" y="290" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#182b40" text-anchor="end">OUT1</text><circle cx="1380" cy="400" r="6" stroke="#263238" fill="white" stroke-width="2"/><text x="1365" y="390" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#182b40" text-anchor="end">OUT2</text><circle cx="930" cy="600" r="6" stroke="#263238" fill="white" stroke-width="2"/><text x="945" y="590" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#182b40" text-anchor="start">A / YELLOW lead</text><circle cx="930" cy="690" r="6" stroke="#263238" fill="white" stroke-width="2"/><text x="945" y="680" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#182b40" text-anchor="start">B / GREEN lead</text><circle cx="1360" cy="790" r="6" stroke="#263238" fill="white" stroke-width="2"/><text x="1360" y="897" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#182b40" text-anchor="middle">RED</text><circle cx="1480" cy="790" r="6" stroke="#263238" fill="white" stroke-width="2"/><text x="1480" y="897" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#182b40" text-anchor="middle">WHITE</text><text x="585" y="323" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#7b1fa2" text-anchor="start">W13 VIOLET (suggested)</text><text x="585" y="413" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#d65f00" text-anchor="start">W14 ORANGE (suggested)</text><text x="585" y="583" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#a68400" text-anchor="start">W15 YELLOW (harness)</text><text x="585" y="673" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#218739" text-anchor="start">W16 GREEN (harness)</text><text x="1420" y="280" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#c62828" text-anchor="start">W17 RED</text><text x="1400" y="385" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#182b40" text-anchor="start">W18 WHITE</text><text x="110" y="830" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#182b40" text-anchor="start">U2 power: 3V3 / GND on sheet 1.</text><text x="110" y="855" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#182b40" text-anchor="start">E1 power: BLUE -&gt; +3.3V; BLACK -&gt; GND (sheet 1).</text><text x="110" y="880" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#182b40" text-anchor="start">GPIO3 and GPIO4 use firmware INPUT_PULLUP at 3.3V.</text><text x="110" y="905" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#182b40" text-anchor="start">No separate encoder/controller board is required.</text><text x="90" y="1020" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#182b40" text-anchor="start">OUT1 / OUT2 reverse polarity with direction: WHITE is NOT a permanent 12V- / GND lead.</text><text x="90" y="1045" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#182b40" text-anchor="start">Encoder BLACK = common 0V. Never apply +12V to the encoder supply or signal leads.</text></svg>