<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800"><rect width="1100" height="800" fill="#f7f9fc"/><style>text{font-family:Arial,sans-serif;fill:#182b40}.title{font-size:28px;font-weight:bold}.head{font-size:20px;font-weight:bold}.small{font-size:16px}.wire{fill:none;stroke-width:4;stroke-linejoin:round}</style><text x="30" y="42" class="title">ESP32-C3 / DRV8871 / six-wire encoder motor</text><text x="30" y="70" class="small">Schematic connections by label — not physical header pin order</text><rect x="30" y="110" width="260" height="120" rx="10" fill="white" stroke="#9caec1" stroke-width="2"/><text x="45" y="140" class="head">12V barrel jack</text><text x="45" y="172" class="small">Centre positive → +12V</text><text x="45" y="199" class="small">Outer negative → GND</text><rect x="30" y="280" width="260" height="160" rx="10" fill="white" stroke="#9caec1" stroke-width="2"/><text x="45" y="310" class="head">Mini360</text><text x="45" y="342" class="small">IN+ / IN− ← 12V / GND</text><text x="45" y="369" class="small">OUT+ → 3.30V rail</text><text x="45" y="396" class="small">OUT− → common GND</text><text x="45" y="423" class="small">Adjust BEFORE ESP connection</text><rect x="390" y="110" width="280" height="200" rx="10" fill="white" stroke="#9caec1" stroke-width="2"/><text x="405" y="140" class="head">DRV8871</text><text x="405" y="172" class="small">POWER+ / VM ← +12V</text><text x="405" y="199" class="small">POWER− / GND ← GND</text><text x="405" y="226" class="small">IN1 ← GPIO0</text><text x="405" y="253" class="small">IN2 ← GPIO1</text><text x="405" y="280" class="small">OUT1 / OUT2 → red / white</text><rect x="390" y="365" width="280" height="190" rx="10" fill="white" stroke="#9caec1" stroke-width="2"/><text x="405" y="395" class="head">ESP32-C3 SuperMini</text><text x="405" y="427" class="small">3V3 ← Mini360 OUT+</text><text x="405" y="454" class="small">GND ← common GND</text><text x="405" y="481" class="small">GPIO0 / GPIO1 → IN1 / IN2</text><text x="405" y="508" class="small">GPIO3 ← yellow encoder A</text><text x="405" y="535" class="small">GPIO4 ← green encoder B</text><rect x="780" y="110" width="290" height="230" rx="10" fill="white" stroke="#9caec1" stroke-width="2"/><text x="795" y="140" class="head">JGY-370 motor + encoder</text><text x="795" y="172" class="small">Red / white ← OUT1 / OUT2</text><text x="795" y="199" class="small">Blue encoder V+ ← 3.30V</text><text x="795" y="226" class="small">Black encoder GND ← GND</text><text x="795" y="253" class="small">Yellow signal → GPIO3</text><text x="795" y="280" class="small">Green signal → GPIO4</text><text x="795" y="307" class="small">Never apply 12V to encoder</text><polyline points="290,150 340,150 340,155 390,155" class="wire" stroke="#c73b45"/><polyline points="160,230 160,280" class="wire" stroke="#c73b45"/><polyline points="290,355 330,355 330,420 390,420" class="wire" stroke="#2871bd"/><polyline points="330,355 730,355 730,205 780,205" class="wire" stroke="#2871bd"/><polyline points="670,190 715,190 715,175 780,175" class="wire" stroke="#915433"/><polyline points="530,365 530,310" class="wire" stroke="#7654ad"/><polyline points="670,495 750,495 750,260 780,260" class="wire" stroke="#278445"/><rect x="30" y="600" width="1040" height="155" rx="10" fill="#fff2d7"/><text x="50" y="632" class="head">All grounds are common</text><text x="50" y="665" class="small">Jack negative, Mini360 IN−/OUT−, ESP GND, driver GND and encoder black.</text><text x="50" y="699" class="head">USB service: 12V OFF. Run on 12V: USB disconnected.</text><text x="50" y="730" class="small">Do not connect USB and the external Mini360-to-3V3 supply simultaneously.</text></svg>
